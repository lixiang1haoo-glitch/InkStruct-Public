name: team-baseline
on:
  pull_request:
  push:
    branches: [main, codex/team-baseline-20261022]
permissions:
  contents: read
jobs:
  data-free-core:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install CPU desktop test dependencies
        run: python -m pip install -e ".[desktop,dev]"
      - name: Check repository boundaries
        run: python scripts/check_repository_hygiene.py
      - name: Run tests independent of author data
        run: python -B -m pytest tests/test_character_sets.py tests/test_generation_targets.py tests/test_collection_receipt.py tests/test_recommend.py tests/test_v61_starter_collection.py tests/test_v62_semantics.py -p no:cacheprovider
