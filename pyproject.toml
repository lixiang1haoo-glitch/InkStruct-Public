[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "inkstruct"
version = "0.2.0"
description = "Structure-prior personalized online Chinese handwriting trajectory generation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.1,<3",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
desktop = ["PySide6==6.9.2"]
train = ["torch>=2.7,<3", "h5py>=3.12,<4", "lmdb>=2.1,<3"]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]
experiment = ["matplotlib>=3.9,<4"]

[project.scripts]
inkstruct = "inkstruct.cli:main"
inkstruct-collector = "inkstruct.collector:main"
inkstruct-generator = "inkstruct.generator_app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inkstruct"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
