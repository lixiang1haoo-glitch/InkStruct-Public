[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "inkstruct"
version = "0.2.0"
description = "Structure-prior personalized online Chinese handwriting trajectory generation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.1,<3",
  "Pillow>=11,<13",
  "markdown-it-py==4.0.0",
  "mdurl==0.1.2",
]

[project.optional-dependencies]
desktop = [
  "PySide6==6.9.2",
  "matplotlib>=3.9,<4",
  "winrt-Windows.Data.Pdf==4!10.0.28000.2957; sys_platform == 'win32'",
]
train = ["torch>=2.7,<3", "h5py>=3.12,<4", "lmdb>=2.1,<3"]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]
experiment = ["matplotlib>=3.9,<4"]

[project.scripts]
inkstruct = "inkstruct.cli:main"
inkstruct-app = "inkstruct.application:main"
inkstruct-collector = "inkstruct.collector:main"
inkstruct-generator = "inkstruct.generator_app:main"
inkstruct-editor = "inkstruct.editor.app:main"
inkstruct-table = "inkstruct.table_editor.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inkstruct"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
